name: Daily forward research
on:
  workflow_dispatch:
  schedule:
    # After regular US close in both standard and daylight time; also audit weekends.
    - cron: '35 22 * * *'
permissions:
  contents: read
  id-token: write
concurrency:
  group: private-research-state
  cancel-in-progress: false
jobs:
  research:
    if: vars.RESEARCH_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-ops.txt
            requirements-ops.lock
      - name: Install operational dependencies only
        run: python -m pip install -r requirements-ops.lock
      - name: Verify operational invariants before accessing private state
        run: python -m unittest -q
      - name: Authenticate to private backup storage using OIDC
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c
        with:
          role-to-assume: ${{ vars.RESEARCH_AWS_ROLE_ARN }}
          aws-region: ${{ vars.RESEARCH_AWS_REGION }}
      - name: Restore verified private state
        id: restore
        env:
          RESEARCH_STATE_BUCKET: ${{ vars.RESEARCH_STATE_BUCKET }}
        run: python state_remote.py pull --bucket "$RESEARCH_STATE_BUCKET"
      - name: Collect, score, back up and monitor
        id: operation
        continue-on-error: true
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: |
          mkdir -p reports
          python operations.py > reports/operations.json
      - name: Preserve backup and advance state only after healthy operation
        if: always() && steps.restore.outcome == 'success'
        env:
          RESEARCH_STATE_BUCKET: ${{ vars.RESEARCH_STATE_BUCKET }}
          OPERATION_OUTCOME: ${{ steps.operation.outcome }}
        run: |
          if [ "$OPERATION_OUTCOME" = success ]; then
            python state_remote.py push --bucket "$RESEARCH_STATE_BUCKET"
          else
            python state_remote.py push --bucket "$RESEARCH_STATE_BUCKET" --archive-only
          fi
      - name: Publish metadata summary and fail on operational alerts
        if: always() && steps.restore.outcome == 'success'
        env:
          OPERATION_OUTCOME: ${{ steps.operation.outcome }}
        run: |
          if [ -f reports/operations.json ]; then
            cat reports/operations.json >> "$GITHUB_STEP_SUMMARY"
          fi
          test "$OPERATION_OUTCOME" = success
